spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/DB_SanFelipe}
# Los proveedores de hosting (Railway, Render, Fly...) inyectan el puerto en PORT.
# Sin esto la aplicacion escucharia en 8080 y el proveedor no podria enrutarla.
server.port=${PORT:${SERVER_PORT:8080}}

# Proveedor del asistente (API con formato OpenAI). Por defecto Cerebras.
# Sin clave la aplicacion arranca igual, pero el chat responde que no esta configurado.
# Para desarrollo local ver application-local.properties.
llm.api.url=${LLM_API_URL:https://api.cerebras.ai/v1/chat/completions}
llm.api.key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-3.8-27b}

# Clima (Open-Meteo, gratuita y sin clave). Se guarda en cada lavado y precarga
# la pantalla de prediccion. Coordenadas del lavadero: Cartagena de Indias.
clima.latitud=${CLIMA_LATITUD:10.3910}
clima.longitud=${CLIMA_LONGITUD:-75.4794}
clima.zona-horaria=${CLIMA_ZONA_HORARIA:America/Bogota}
clima.habilitado=${CLIMA_HABILITADO:true}

# Cuenta inicial: solo se crea si la base de datos no tiene ningun usuario.
# Sin ADMIN_PASSWORD no se crea nada (antes la contrasenia estaba en el codigo).
admin.usuario=${ADMIN_USUARIO:admin}
admin.password=${ADMIN_PASSWORD:}
